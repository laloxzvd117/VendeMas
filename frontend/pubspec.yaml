name: vendemas
description: App de punto de venta para pequeños comerciantes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.2.1
  intl: ^0.19.0
  provider: ^6.1.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.2
  # Base de datos local
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
